<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nim Online（最多拿 3，單堆）</title>
    <style>
        :root {
            --bg: #0b1220;
            --card: #111a2e;
            --muted: #9fb0d0;
            --text: #e7eefc;
            --accent: #7aa2ff;
            --danger: #ff6b6b;
            --ok: #5eead4;
            --border: rgba(255, 255, 255, 0.10);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, "Noto Sans TC", sans-serif;
            background: radial-gradient(1200px 700px at 20% 10%, rgba(122, 162, 255, 0.18), transparent 55%),
                radial-gradient(1000px 700px at 85% 20%, rgba(94, 234, 212, 0.12), transparent 50%),
                var(--bg);
            color: var(--text);
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 700;
        }

        .sub {
            color: var(--muted);
            margin: 0 0 18px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 18px;
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 16px;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin: 10px 0 6px;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.25);
            color: var(--text);
            outline: none;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btnrow {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(122, 162, 255, 0.18);
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: rgba(122, 162, 255, 0.28);
        }

        button.danger {
            background: rgba(255, 107, 107, 0.18);
        }

        button.danger:hover {
            background: rgba(255, 107, 107, 0.28);
        }

        button.ghost {
            background: rgba(255, 255, 255, 0.06);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.22);
            color: var(--muted);
            font-size: 13px;
        }

        .pill b {
            color: var(--text);
        }

        .statusline {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .gamehead {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .board {
            display: grid;
            gap: 12px;
        }

        .pile {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.18);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .pile .left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 120px;
        }

        .pile .title {
            font-weight: 700;
        }

        .pile .count {
            color: var(--muted);
            font-size: 13px;
        }

        .stones {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            max-height: 76px;
            overflow: auto;
            padding: 4px 2px;
        }

        .stone {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: rgba(231, 238, 252, 0.70);
            border: 1px solid rgba(0, 0, 0, 0.35);
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .actions select {
            width: 90px;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
            margin-top: 10px;
        }

        .log {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.18);
            color: var(--muted);
            font-size: 13px;
            white-space: pre-wrap;
            min-height: 44px;
        }

        .ok {
            color: var(--ok);
        }

        .bad {
            color: var(--danger);
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        @media (max-width: 980px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>Nim Online（最多拿 3、每回合只能動一堆）</h1>
        <p class="sub">
            房主建立房間取得代碼，另一位輸入代碼加入。回合制同步，最後拿走最後一顆者勝。
        </p>

        <div class="grid">
            <div class="card">
                <h2>連線 / 房間</h2>
                <div class="btnrow">
                    <button id="btnReset" class="danger">清除本機身分</button>
                </div>

                <div class="statusline">
                    <span class="pill">玩家 ID：<b class="mono" id="meId">-</b></span>
                    <span class="pill">角色：<b id="role">-</b></span>
                </div>

                <hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">

                <h2>建立房間（房主）</h2>
                <div class="row">
                    <div>
                        <label>堆數（1~8）</label>
                        <select id="numPiles">
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option selected>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                        </select>
                    </div>
                    <div>
                        <label>總石頭數（> 堆數）</label>
                        <input id="totalStones" type="number" min="2" value="20" />
                    </div>
                </div>
                <div class="btnrow">
                    <button id="btnCreate">建立房間</button>
                    <button id="btnStart" class="ghost" disabled>開始遊戲</button>
                </div>

                <label>加入房間（客人）</label>
                <input id="roomCodeInput" placeholder="輸入房間代碼（例如 A7KQ9D）" />
                <div class="btnrow">
                    <button id="btnJoin">加入</button>
                    <button id="btnLeave" class="danger" disabled>離開 / 關閉房間</button>
                </div>

                <div class="hint">
                    規則：一次只能在一堆上拿 1~3 顆，且必須拿。<br>
                    小提醒：GitHub Pages 是靜態站，需要用 Supabase 同步狀態。
                </div>

                <div class="log" id="log"></div>
            </div>

            <div class="card">
                <div class="gamehead">
                    <div>
                        <h2>棋盤</h2>
                        <div class="statusline">
                            <span class="pill">房間：<b class="mono" id="roomCode">-</b></span>
                            <span class="pill">狀態：<b id="roomStatus">-</b></span>
                            <span class="pill">輪到：<b id="turnWho">-</b></span>
                        </div>
                    </div>
                    <div class="statusline">
                        <span class="pill">我方：<b id="meLabel">-</b></span>
                    </div>
                </div>

                <div class="board" id="board"></div>

                <div class="hint">
                    玩法：在某一堆選擇要拿的顆數（1~3），按「拿走」。只要任一堆歸零不影響其他堆。<br>
                    勝負：拿走最後一顆的人獲勝（所有堆都為 0）。
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (() => {
            const $ = (id) => document.getElementById(id);

            // ======= 設定區（建議你部署前寫死，避免每次輸入） =======
            const PRESET_URL = "https://imxzafwkfklwyzncxtxu.supabase.co";
            const PRESET_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlteHphZndrZmtsd3l6bmN4dHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMjQ1NjgsImV4cCI6MjA4NTcwMDU2OH0.pUV2TzVAMJrEqGBqkBEF7AkOeA4nebheTYq0pRS9O_s";
            // ===========================================================

            const LS_ME = "nim_me_id_v1";
            const LS_SB_URL = "nim_sb_url_v1";
            const LS_SB_KEY = "nim_sb_key_v1";

            const state = {
                sb: null,
                meId: null,
                role: null,        // 'host' | 'guest'
                roomCode: null,
                room: null,        // latest room row
                channel: null,     // realtime channel
                ready: false,
            };
            window.__nim_state = state;

            function log(msg, cls = "") {
                const el = $("log");
                el.innerHTML = (cls ? `<span class="${cls}">` : "") + msg + (cls ? "</span>" : "");
            }

            function genId() {
                // 簡單 UUID-ish（足夠 demo）
                return "p_" + crypto.getRandomValues(new Uint32Array(4)).join("_");
            }

            function genCode() {
                const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
                let out = "";
                for (let i = 0; i < 6; i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
                return out;
            }

            function ensureMe() {
                let id = localStorage.getItem(LS_ME);
                if (!id) {
                    id = genId();
                    localStorage.setItem(LS_ME, id);
                }
                state.meId = id;
                $("meId").textContent = id;
            }

            function setRole(role) {
                state.role = role;
                $("role").textContent = role ? (role === "host" ? "房主" : "客人") : "-";
                $("meLabel").textContent = role ? (role === "host" ? "你是房主" : "你是客人") : "-";
            }

            function setRoomMeta(room) {
                state.room = room;
                $("roomCode").textContent = room?.code ?? "-";
                $("roomStatus").textContent = room?.status ?? "-";
                $("turnWho").textContent = room?.turn ? (room.turn === "host" ? "房主" : "客人") : "-";
                $("btnLeave").disabled = !room;
                $("btnStart").disabled = !(room && state.role === "host" && room.status === "waiting" && room.guest_id);
            }

            function randomPiles(numPiles, total) {
                // 每堆至少 1，剩下的隨機加
                const piles = Array(numPiles).fill(1);
                let rem = total - numPiles;
                for (let i = 0; i < rem; i++) {
                    const idx = Math.floor(Math.random() * numPiles);
                    piles[idx] += 1;
                }
                return piles;
            }

            function allZero(piles) {
                return piles.every(x => x === 0);
            }

            function renderBoard(room) {
                const board = $("board");
                board.innerHTML = "";
                if (!room) return;
                const piles = room.piles;
                piles.forEach((cnt, idx) => {
                    const pile = document.createElement("div");
                    pile.className = "pile";

                    const left = document.createElement("div");
                    left.className = "left";
                    left.innerHTML = `<div class="title">第 ${idx + 1} 堆</div><div class="count">剩餘：<b>${cnt}</b></div>`;

                    const stones = document.createElement("div");
                    stones.className = "stones";
                    const shown = Math.min(cnt, 60);
                    for (let i = 0; i < shown; i++) {
                        const s = document.createElement("div");
                        s.className = "stone";
                        stones.appendChild(s);
                    }
                    if (cnt > shown) {
                        const more = document.createElement("span");
                        more.style.color = "var(--muted)";
                        more.style.fontSize = "12px";
                        more.textContent = `+${cnt - shown}`;
                        stones.appendChild(more);
                    }

                    const actions = document.createElement("div");
                    actions.className = "actions";

                    const sel = document.createElement("select");
                    [1, 2, 3].forEach(v => {
                        const opt = document.createElement("option");
                        opt.value = String(v);
                        opt.textContent = String(v);
                        sel.appendChild(opt);
                    });

                    const btn = document.createElement("button");
                    btn.textContent = "拿走";
                    btn.onclick = () => doMove(idx, parseInt(sel.value, 10));

                    // enable/disable by turn + status
                    const myTurn = (room.status === "playing" && state.role && room.turn === state.role);
                    const can = myTurn && cnt > 0;
                    sel.disabled = !can;
                    btn.disabled = !can;

                    actions.appendChild(sel);
                    actions.appendChild(btn);

                    pile.appendChild(left);
                    pile.appendChild(stones);
                    pile.appendChild(actions);

                    board.appendChild(pile);
                });

                if (room.status === "ended") {
                    if (room.winner) {
                        const win = (room.winner === state.role);
                        log(`遊戲結束：${room.winner === "host" ? "房主" : "客人"}獲勝。${win ? "（你贏了）" : "（你輸了）"}`, win ? "ok" : "bad");
                    } else {
                        log("遊戲結束。", "");
                    }
                }
            }

            async function initSupabase() {
                const url = PRESET_URL || $("sbUrl")?.value?.trim();
                const key = PRESET_KEY || $("sbKey")?.value?.trim();

                if (!url || !key) {
                    log("Supabase 設定缺失（URL / anon key）", "bad");
                    state.ready = false;
                    return;
                }

                // ✅ 先建立 client
                state.sb = supabase.createClient(url, key, {
                    realtime: { params: { eventsPerSecond: 10 } }
                });

                // ✅ 匿名登入：讓 auth.uid() 有值，配合緊 RLS
                const { data: { session } } = await state.sb.auth.getSession();
                if (!session) {
                    const { error } = await state.sb.auth.signInAnonymously();
                    if (error) {
                        log("匿名登入失敗：" + error.message, "bad");
                        state.ready = false;
                        return;
                    }
                }

                // ✅ 取得 uid
                const { data: { session: s2 } } = await state.sb.auth.getSession();
                state.meId = s2.user.id;   // UUID
                $("meId").textContent = state.meId;

                state.ready = true;
                log("Supabase 連線完成（匿名登入）", "ok");
            }


            async function subscribeRoom(code) {
                if (!state.sb) throw new Error("Supabase 未初始化");
                if (state.channel) {
                    await state.sb.removeChannel(state.channel);
                    state.channel = null;
                }
                state.channel = state.sb.channel("nim_room_" + code);

                state.channel
                    .on("postgres_changes", {
                        event: "*",
                        schema: "public",
                        table: "nim_rooms",
                        filter: "code=eq." + code
                    }, payload => {
                        const row = payload.new;
                        if (!row) return;
                        state.room = row;
                        setRoomMeta(row);
                        renderBoard(row);
                    });

                const { error } = await state.channel.subscribe();
                if (error) {
                    log("訂閱房間更新失敗：" + error.message, "bad");
                }
            }

            async function fetchRoom(code) {
                const { data, error } = await state.sb
                    .from("nim_rooms")
                    .select("*")
                    .eq("code", code)
                    .maybeSingle();
                if (error) throw error;
                return data;
            }

            async function createRoom() {
                if (!state.sb) { log("請先初始化 Supabase。", "bad"); return; }
                setRole("host");

                const numPiles = parseInt($("numPiles").value, 10);
                const total = parseInt($("totalStones").value, 10);

                if (!(numPiles >= 1 && numPiles <= 8)) { log("堆數必須在 1~8。", "bad"); return; }
                if (!(total > numPiles)) { log("總石頭數必須大於堆數（每堆至少 1）。", "bad"); return; }

                let code = genCode();
                // 避免撞碼：最多嘗試幾次
                for (let tries = 0; tries < 5; tries++) {
                    const exists = await fetchRoom(code);
                    if (!exists) break;
                    code = genCode();
                }

                const piles = randomPiles(numPiles, total);
                const row = {
                    code,
                    host_id: state.meId,
                    guest_id: null,
                    num_piles: numPiles,
                    total_stones: total,
                    piles,
                    turn: "host",      // 先手：房主
                    status: "waiting",
                    winner: null,
                    updated_at: new Date().toISOString()
                };

                const { data, error } = await state.sb
                    .from("nim_rooms")
                    .insert(row)
                    .select()
                    .single();

                if (error) { log("建立房間失敗：" + error.message, "bad"); return; }

                state.roomCode = code;
                setRoomMeta(data);
                renderBoard(data);
                await subscribeRoom(code);

                log(`房間已建立。代碼：${code}（請把代碼給另一位玩家加入）`, "ok");
            }

            async function joinRoom() {
                if (!state.sb) { log("請先初始化 Supabase。", "bad"); return; }

                const code = $("roomCodeInput").value.trim().toUpperCase();
                if (!code) { log("請輸入房間代碼。", "bad"); return; }

                const room = await fetchRoom(code);
                if (!room) { log("找不到此房間代碼。", "bad"); return; }
                if (room.status === "ended") { log("此房間已結束，請房主重開。", "bad"); return; }
                if (room.guest_id && room.guest_id !== state.meId) {
                    log("此房間已有人加入（客人已滿）。", "bad");
                    return;
                }

                // 若我是房主再次進來（同裝置重新整理）
                if (room.host_id === state.meId) {
                    setRole("host");
                } else {
                    setRole("guest");
                }

                // 若我不是房主且 guest 空，嘗試佔位
                if (state.role === "guest" && !room.guest_id) {
                    const { data, error } = await state.sb
                        .from("nim_rooms")
                        .update({ guest_id: state.meId, updated_at: new Date().toISOString() })
                        .eq("code", code)
                        .is("guest_id", null)
                        .select()
                        .single();

                    if (error) { log("加入房間失敗：" + error.message, "bad"); return; }
                    state.roomCode = code;
                    setRoomMeta(data);
                    renderBoard(data);
                } else {
                    state.roomCode = code;
                    setRoomMeta(room);
                    renderBoard(room);
                }

                await subscribeRoom(code);

                if (state.role === "host") {
                    log(`你是房主，房間：${code}。等待另一位加入後可按「開始遊戲」。`, "ok");
                } else {
                    log(`你已加入房間：${code}。等待房主開始遊戲。`, "ok");
                }
            }

            async function startGame() {
                if (!state.sb || !state.roomCode) return;
                if (state.role !== "host") { log("只有房主能開始遊戲。", "bad"); return; }

                const room = await fetchRoom(state.roomCode);
                if (!room) return;
                if (!room.guest_id) { log("尚未有客人加入。", "bad"); return; }
                if (room.status !== "waiting") { log("遊戲狀態不允許開始。", "bad"); return; }

                const { data, error } = await state.sb
                    .from("nim_rooms")
                    .update({ status: "playing", turn: "host", winner: null, updated_at: new Date().toISOString() })
                    .eq("code", room.code)
                    .eq("host_id", state.meId)
                    .select()
                    .single();

                if (error) { log("開始遊戲失敗：" + error.message, "bad"); return; }
                setRoomMeta(data);
                renderBoard(data);
                log("遊戲已開始。房主先手。", "ok");
            }

            async function doMove(pileIdx, take) {
                const room = state.room;
                if (!room) return;

                if (room.status !== "playing") { log("目前不是遊戲進行中。", "bad"); return; }
                if (!state.role) { log("未設定角色。", "bad"); return; }
                if (room.turn !== state.role) { log("還沒輪到你。", "bad"); return; }
                if (!(take >= 1 && take <= 3)) { log("一次只能拿 1~3 顆。", "bad"); return; }

                const piles = [...room.piles];
                if (pileIdx < 0 || pileIdx >= piles.length) return;
                if (piles[pileIdx] <= 0) { log("這堆已經空了。", "bad"); return; }
                if (take > piles[pileIdx]) { log("不能拿超過該堆剩餘數。", "bad"); return; }

                piles[pileIdx] -= take;

                let status = room.status;
                let winner = room.winner;
                let nextTurn = (room.turn === "host") ? "guest" : "host";

                if (allZero(piles)) {
                    status = "ended";
                    winner = room.turn; // 拿走最後一顆者勝（當前行動者）
                    nextTurn = room.turn;
                }

                // 重要：用 turn 來做基本並發防護（避免非自己回合亂改）
                const { data, error } = await state.sb
                    .from("nim_rooms")
                    .update({
                        piles,
                        turn: nextTurn,
                        status,
                        winner,
                        updated_at: new Date().toISOString()
                    })
                    .eq("code", room.code)
                    .eq("turn", state.role) // 只有輪到我才允許更新
                    .select()
                    .single();

                if (error) {
                    log("更新失敗（可能剛被對方先一步更新或非你回合）：" + error.message, "bad");
                    return;
                }

                setRoomMeta(data);
                renderBoard(data);

                if (status !== "ended") {
                    log(`你從第 ${pileIdx + 1} 堆拿走 ${take} 顆。換對方。`, "ok");
                }
            }

            async function leaveRoom() {
                if (!state.sb || !state.roomCode) return;
                const code = state.roomCode;
                const room = await fetchRoom(code);
                if (!room) return;

                // 房主：刪除房間（demo 簡化）
                if (state.role === "host" && room.host_id === state.meId) {
                    const { error } = await state.sb.from("nim_rooms").delete().eq("code", code).eq("host_id", state.meId);
                    if (error) { log("關閉房間失敗：" + error.message, "bad"); return; }
                    log("房間已關閉。", "ok");
                } else {
                    // 客人：退出（清 guest_id）
                    const { error } = await state.sb
                        .from("nim_rooms")
                        .update({ guest_id: null, status: (room.status === "playing" ? "ended" : room.status), updated_at: new Date().toISOString() })
                        .eq("code", code)
                        .eq("guest_id", state.meId);
                    if (error) { log("離開失敗：" + error.message, "bad"); return; }
                    log("你已離開房間。", "ok");
                }

                if (state.channel) {
                    await state.sb.removeChannel(state.channel);
                    state.channel = null;
                }
                state.roomCode = null;
                state.room = null;
                setRole(null);
                setRoomMeta(null);
                renderBoard(null);
                $("roomCodeInput").value = "";
            }

            function resetIdentity() {
                localStorage.removeItem(LS_ME);
                ensureMe();
                setRole(null);
                log("已清除本機玩家身分。", "ok");
            }

            // ======= UI wiring =======
            function loadPresets() {
                const url = localStorage.getItem(LS_SB_URL) || PRESET_URL;
                const key = localStorage.getItem(LS_SB_KEY) || PRESET_KEY;
                $("sbUrl").value = url || "";
                $("sbKey").value = key || "";
            }

            $("btnReset").onclick = resetIdentity;
            $("btnCreate").onclick = createRoom;
            $("btnJoin").onclick = joinRoom;
            $("btnStart").onclick = startGame;
            $("btnLeave").onclick = leaveRoom;

            // init
            (async () => {
                ensureMe();        // 這行可留（但之後可考慮移除，見下方說明）
                loadPresets();
                $("btnCreate").disabled = true;
                $("btnJoin").disabled = true;
                await initSupabase();   // ✅ 關鍵：一定要 await
                if (state.ready) {
                    $("btnCreate").disabled = false;
                    $("btnJoin").disabled = false;
                }
                setRole(null);
                setRoomMeta(null);
                renderBoard(null);
            })();
            log("連線完成。可直接建立或加入房間。", "ok");
        })();
    </script>
</body>

</html>
